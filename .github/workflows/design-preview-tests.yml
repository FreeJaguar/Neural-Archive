name: Cinematic Design Preview Validation

on:
  pull_request:
    paths:
      - "design.html"
      - "design.css"
      - "design.js"
      - "hero-motion.js"
      - "hero-motion.css"
      - "assets/design-portal-backdrop.svg"
      - "assets/design-portal.svg"
      - "tests/design-preview.test.mjs"
      - ".github/workflows/design-preview-tests.yml"
  push:
    branches: ["design/neural-archive-cinematic-experience", "main"]
    paths:
      - "design.html"
      - "design.css"
      - "design.js"
      - "hero-motion.js"
      - "hero-motion.css"
      - "assets/design-portal-backdrop.svg"
      - "assets/design-portal.svg"
      - "tests/design-preview.test.mjs"
      - ".github/workflows/design-preview-tests.yml"

permissions:
  contents: read

jobs:
  preview-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check design.js
          node --check hero-motion.js
      - name: Run offline design integration checks
        run: node --test tests/design-preview.test.mjs
