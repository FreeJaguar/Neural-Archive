name: Cinematic Hero Visual Smoke

on:
  push:
    branches: ["design/neural-archive-cinematic-experience"]
    paths:
      - "hero-motion.css"
      - "hero-motion.js"
      - "design.css"
      - "design.js"
      - "design.html"
      - "assets/cinematic-*.webp"
      - "tests/hero-viewport.smoke.mjs"
      - ".github/workflows/hero-visual-smoke.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install a pinned Chromium test runtime
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve real static preview and inspect viewport geometry
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/neural-hero-server.log 2>&1 &
          sleep 2
          node tests/hero-viewport.smoke.mjs
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-hero-viewport-screenshots
          path: artifacts/hero-preview/
          if-no-files-found: ignore
          retention-days: 7
